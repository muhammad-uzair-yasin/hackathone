<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BioRoute Cold-Chain AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #09090b;
    --card: #18181b;
    --border: #27272a;
    --primary: #3b82f6;
    --primary-glow: rgba(59, 130, 246, 0.3);
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --green: #10b981;
    --orange: #f59e0b;
    --red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(9, 9, 11, 0.8);
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  
  .brand {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 18px;
  }

  .status-badge {
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s ease;
  }

  .status-badge.active .status-dot {
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ── Main Layout ── */
  main {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  
  .main-content {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* ── Center Start Button ── */
  #start-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 20;
    transition: opacity 0.5s ease, visibility 0.5s;
  }

  #start-overlay h1 {
    font-size: 48px;
    font-weight: 300;
    margin-bottom: 16px;
    letter-spacing: -1px;
    text-align: center;
  }

  #start-overlay p {
    color: var(--muted);
    margin-bottom: 40px;
    font-size: 16px;
  }

  .start-btn {
    background: linear-gradient(135deg, var(--primary), #6366f1);
    color: white;
    border: none;
    padding: 18px 48px;
    border-radius: 99px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 8px 32px var(--primary-glow);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5);
  }

  /* ── Live Trace Container ── */
  .trace-container {
    padding: 40px;
    flex: 1;
    overflow-y: auto;
    height: 100%;
    padding-bottom: 100px;
  }
  
  /* ── Sidebar ── */
  .sidebar {
    width: 380px;
    background: rgba(0, 0, 0, 0.3);
    border-left: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  
  .sidebar h3 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--primary);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── Event Cards ── */
  .event-node {
    display: flex;
    gap: 20px;
    opacity: 0;
    transform: translateY(20px);
    animation: slideUp 0.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 24px;
  }
  
  /* Indent subagents and tools */
  .event-node.subagent, .event-node.tool {
    margin-left: 56px;
    border-left: 2px solid rgba(255, 255, 255, 0.1);
    padding-left: 20px;
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .node-icon-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .node-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    z-index: 2;
  }

  .node-line {
    width: 2px;
    flex: 1;
    background: var(--border);
    min-height: 20px;
  }

  .node-content {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .event-node.subagent .node-icon { border-color: var(--orange); color: var(--orange); }
  .event-node.tool .node-icon { border-color: var(--primary); color: var(--primary); }
  .event-node.complete .node-icon { border-color: var(--green); color: var(--green); }
  .event-node.coordinator .node-icon { border-color: #a855f7; color: #a855f7; }

  .node-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .node-type {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .node-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .node-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text);
  }

  .node-desc {
    font-size: 15px;
    line-height: 1.6;
    color: #d4d4d8;
  }

  .data-block {
    margin-top: 16px;
    background: #000;
    border-radius: 8px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #a1a1aa;
    overflow-x: auto;
    border: 1px solid var(--border);
  }

  .data-block.highlight {
    border-color: rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }

  /* ── Input Context Box ── */
  .context-box {
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 40px;
    border-left: 4px solid var(--primary);
  }
  
  .context-box h3 {
    font-size: 14px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .context-box p {
    font-size: 16px;
    line-height: 1.6;
    font-style: italic;
  }

  .todo-list {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    padding: 16px;
    margin-top: 12px;
    border: 1px solid var(--border);
  }
  .todo-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 10px;
    font-size: 15px;
    color: var(--muted);
  }
  .todo-item:last-child {
    margin-bottom: 0;
  }
  .todo-icon {
    margin-right: 12px;
    font-size: 16px;
  }
  .todo-item.completed { color: var(--success); }
  .todo-item.in_progress { color: var(--warning); font-weight: 500; }
  .todo-content { flex: 1; line-height: 1.4; }
  .data-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .data-grid {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .data-row {
    display: flex;
    font-size: 14px;
    line-height: 1.5;
  }
  .data-key {
    color: var(--muted);
    width: 200px;
    flex-shrink: 0;
    font-weight: 500;
  }
  .data-value {
    color: #e2e8f0;
    flex: 1;
    word-break: break-word;
  }
  .md-table { 
    width: 100%; 
    border-collapse: collapse; 
    margin: 16px 0; 
    font-size: 14px;
  }
  .md-table th, .md-table td { 
    border: 1px solid var(--border); 
    padding: 10px 14px; 
    text-align: left; 
  }
  .md-table th { 
    background: rgba(255, 255, 255, 0.05); 
    color: var(--primary);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">❄️</div>
    BioRoute Orchestrator
  </div>
  <div class="status-badge" id="status-badge">
    <div class="status-dot"></div>
    <span id="status-text">Standing By</span>
  </div>
</header>

<main>
  <div id="start-overlay">
    <h1>Autonomous Logistics Agent</h1>
    <p>Click below to simulate a real-world supply chain disruption and watch the AI respond.</p>
    <button class="start-btn" onclick="startAgent()">
      ▶ Start Agent
    </button>
  </div>

  <div class="main-content">
    <div class="trace-container" id="trace-container">
      <!-- Events injected here -->
    </div>
    
    <aside class="sidebar">
      <h3>📋 Live Action Plan</h3>
      <div id="todo-sidebar">
        <p style="color:var(--muted);font-size:14px;font-style:italic;">Waiting for orchestrator assessment...</p>
      </div>
    </aside>
  </div>
</main>

<script>
const API = 'http://localhost:8000';
const traceContainer = document.getElementById('trace-container');
const startOverlay = document.getElementById('start-overlay');
const statusBadge = document.getElementById('status-badge');
const statusText = document.getElementById('status-text');

async function getRandomScenario() {
  const res = await fetch(`${API}/api/scenarios`);
  const data = await res.json();
  // Pick a random scenario that has a hazard for better demo
  const hazards = data.scenarios.filter(s => s.affects_shipment);
  return hazards[Math.floor(Math.random() * hazards.length)];
}

function formatMessage(msg) {
  if (!msg) return null;
  
  // Format Todo List and move it to sidebar
  if (msg.startsWith("Updated todo list to")) {
    let html = '<div class="todo-list" style="margin-top:0; border:none; background:transparent; padding:0;">';
    const regex = /['"]content['"]:\s*['"](.*?)['"],\s*['"]status['"]:\s*['"]([^'"]+)['"]/g;
    let match;
    let count = 0;
    while ((match = regex.exec(msg)) !== null) {
      count++;
      const content = match[1];
      const status = match[2];
      const icon = status === 'completed' ? '✅' : (status === 'in_progress' ? '⏳' : '⚪');
      html += `<div class="todo-item ${status}">
        <span class="todo-icon">${icon}</span>
        <span class="todo-content">${content}</span>
      </div>`;
    }
    html += '</div>';
    if (count > 0) {
      document.getElementById('todo-sidebar').innerHTML = html;
      return null; // hide from main timeline
    }
  }

  // Filter out raw JSON dumps or massive file reads (starts with JSON brackets or line numbers)
  if (msg.trim().startsWith('{') || msg.trim().startsWith('1 {') || msg.trim().startsWith('1 #') || msg.trim().startsWith('[{')) {
    if (msg.includes('last_updated') || msg.includes('active_shipments')) {
      return `<div class="data-badge">📄 Reading Active Shipments Database...</div>`;
    }
    if (msg.includes('Business Context')) {
      return `<div class="data-badge">📘 Reviewing Standard Operating Procedures...</div>`;
    }
    return null; // completely hide raw dumps
  }

  // Filter out system logs
  if (msg.includes("STATE LOG WRITTEN")) {
    return `<div class="data-badge">💾 Persisting session state to disk...</div>`;
  }
  
  // Clean up JSON strings that the LLM occasionally emits raw
  if (msg.startsWith('Returning structured response:')) {
    return null; // hide this entirely, the actual structured output is printed below it by the tool/done events
  }

  // Convert markdown bold to HTML
  msg = msg.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  
  // Convert markdown tables to HTML tables
  if (msg.includes('|---') || msg.includes('| ---')) {
     const tableRegex = /(\|.*\|[\s\S]*?(?=\n\n|$))/g;
     msg = msg.replace(tableRegex, match => {
        let rows = match.trim().split('\n');
        let html = '<table class="md-table">';
        rows.forEach((row, i) => {
           if (row.includes('---')) return;
           let tag = i === 0 ? 'th' : 'td';
           let cols = row.split('|').filter(c => c.trim());
           if (cols.length === 0) return;
           html += '<tr>' + cols.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
        });
        return html + '</table>';
     });
  }
  
  return msg.replace(/\n/g, '<br>');
}

function formatDataPayload(data) {
  if (!data) return '';
  if (typeof data !== 'object') return `<div class="node-data-string">${data}</div>`;
  
  // Hide write_todos raw arguments
  if (data.todos) return '';
  
  // Format subagent outputs into clean key-value rows
  let html = '<div class="data-grid">';
  for (const [key, value] of Object.entries(data)) {
    // Skip technical IDs and raw summaries for layman view
    if (['shipment_id', 'vehicle_id', 'driver_id', 'notification_id', 'raw_summary', 'timestamp', 'update_timestamp', 'before_state', 'after_state'].includes(key)) continue;
    
    // Format keys to Title Case
    const cleanKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    
    let displayValue = value;
    if (value === null) {
      displayValue = '<span style="color:var(--muted)">None</span>';
    } else if (typeof value === 'boolean') {
      displayValue = value ? '<span style="color:var(--green)">Yes</span>' : '<span style="color:var(--muted)">No</span>';
    } else if (Array.isArray(value)) {
      displayValue = value.join(', ');
    } else if (typeof value === 'object') {
      displayValue = 'Updated Record';
    }
    
    html += `
      <div class="data-row">
        <span class="data-key">${cleanKey}:</span>
        <span class="data-value">${displayValue}</span>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

function appendEvent(type, title, desc, data = null, customClass = '') {
  const time = new Date().toLocaleTimeString('en-US', { hour12: false });
  
  const icons = {
    coordinator: '🧠',
    subagent: '🤖',
    tool: '🔧',
    complete: '✅'
  };
  const icon = icons[customClass] || '🔹';

  const dataHtml = formatDataPayload(data);

  const node = document.createElement('div');
  node.className = `event-node ${customClass}`;
  node.innerHTML = `
    <div class="node-icon-wrapper">
      <div class="node-icon">${icon}</div>
      <div class="node-line"></div>
    </div>
    <div class="node-content">
      <div class="node-header">
        <span class="node-type">${type}</span>
        <span class="node-time">${time}</span>
      </div>
      <div class="node-title">${title}</div>
      ${desc ? `<div class="node-desc">${desc}</div>` : ''}
      ${dataHtml}
    </div>
  `;
  
  traceContainer.appendChild(node);
  
  // Smooth scroll to bottom
  setTimeout(() => {
    traceContainer.scrollTop = traceContainer.scrollHeight;
  }, 50);
}

async function startAgent() {
  startOverlay.style.opacity = '0';
  setTimeout(() => startOverlay.style.visibility = 'hidden', 500);
  
  statusBadge.classList.add('active');
  statusText.textContent = 'Agent Active';
  traceContainer.innerHTML = '';

  try {
    const scenario = await getRandomScenario();
    
    // Show input context
    const contextBox = document.createElement('div');
    contextBox.className = 'context-box';
    contextBox.innerHTML = `
      <h3>📥 Incoming Data Stream</h3>
      <p>"${scenario.text.replace(/\n/g, '<br>')}"</p>
    `;
    traceContainer.appendChild(contextBox);

    const response = await fetch(`${API}/api/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: scenario.text }),
    });

    if (!response.ok) throw new Error('API Error');

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); 
      
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const event = JSON.parse(line.slice(6));
            handleEvent(event);
          } catch (e) {}
        }
      }
    }
  } catch (err) {
    appendEvent('ERROR', 'Pipeline Failed', err.message, null, 'tool');
  } finally {
    statusBadge.classList.remove('active');
    statusText.textContent = 'Task Completed';
  }
}

function handleEvent(e) {
  switch (e.type) {
    case 'COORDINATOR':
      const formattedCoord = formatMessage(e.message);
      if (formattedCoord) appendEvent('ORCHESTRATOR', 'Reasoning Step', formattedCoord, null, 'coordinator');
      break;
    case 'SUBAGENT_START':
      appendEvent('DELEGATION', `Assigning Task to: ${e.agent}`, `Status: ${e.status}`, null, 'subagent');
      break;
    case 'SUBAGENT_MSG':
      const formattedSub = formatMessage(e.message);
      if (formattedSub) appendEvent('SUBAGENT REASONING', `Agent: ${e.agent}`, formattedSub, null, 'subagent');
      break;
    case 'SUBAGENT_DONE':
      if (e.status === 'completed') {
        appendEvent('DELEGATION COMPLETE', `Subagent: ${e.agent}`, 'Structured data returned to orchestrator:', e.result, 'subagent');
      } else {
        appendEvent('DELEGATION FAILED', `Subagent: ${e.agent}`, 'Error occurred:', e.error, 'subagent');
      }
      break;
    case 'TOOL_CALL':
      appendEvent('TOOL INVOCATION', `Action: ${e.tool_name}`, 'Preparing system request...', e.args, 'tool');
      break;
    case 'TOOL_RESULT':
      if (e.status === 'SUCCESS') {
        appendEvent('TOOL EXECUTION COMPLETE', `Action: ${e.tool_name}`, 'System updated successfully:', e.result, 'tool');
      } else {
        appendEvent('TOOL EXECUTION FAILED', `Action: ${e.tool_name}`, 'Error during execution:', e.error, 'tool');
      }
      break;
    case 'COMPLETE':
      appendEvent('WORKFLOW COMPLETE', 'Incident Resolved', 'Database state updated and notifications dispatched.', e.state_log?.pipeline?.step_4_crm_update || 'All systems normal.', 'complete');
      break;
  }
}
</script>
</body>
</html>
